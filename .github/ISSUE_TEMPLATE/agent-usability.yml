<!-- This project is designed to be operated through an MCP client. When the agent picks
     the wrong tool, guesses a parameter, or paints in the wrong order, that is a product
     defect with an owner — not a user error. This template is the fastest way we have of
     finding out which of our descriptions, guides, remediations or error codes are
     responsible. -->

This is not a "the model was dumb" report. It is: **at this point the agent had this
information, and it still made this choice.** Tell us what it knew and what it did, and
whether the tool surface gave it a way out.

