name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Build npm distribution
        run: pnpm build:npm

      - name: Create package tarball
        shell: bash
        run: |
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          test -n "$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)"

      - name: Install tarball in a clean consumer
        shell: bash
        run: |
          TARBALL="$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/pixel --version | tee version.json
          node -e "const v=require('./version.json'); if (v.name !== 'dotloom-mcp' || v.version !== '0.2.0') process.exit(1)"
          ./node_modules/.bin/pixel-mcp --version
          ./node_modules/.bin/pixel-art-mcp --version
          ./node_modules/.bin/dotloom-mcp --version
          ./node_modules/.bin/pixel new smoke.pixel --width 8 --height 8 --layers Ink --frames 1
          ./node_modules/.bin/pixel export smoke.pixel --out smoke.png --scale 2
          test -s smoke.png
          node --input-type=module <<'NODE'
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js';
          import { VERSION, core, mcp, script } from 'dotloom-mcp';
          if (VERSION !== '0.2.0') throw new Error(`unexpected package version: ${VERSION}`);
          if (core.createSprite({ width: 2, height: 2 }).width !== 2) throw new Error('core API unavailable');
          if (typeof mcp.createPixelServer !== 'function') throw new Error('MCP API unavailable');
          if (typeof script.ScriptRuntime !== 'function') throw new Error('script API unavailable');
          const transport = new StdioClientTransport({
            command: process.execPath,
            args: ['node_modules/dotloom-mcp/dist/pixel-mcp.js'],
          });
          const client = new Client({ name: 'tarball-smoke', version: '1.0.0' });
          await client.connect(transport);
          const result = await client.listTools();
          if (result.tools.length === 0) throw new Error('installed MCP server exposed no tools');
          console.log(JSON.stringify({ server: client.getServerVersion(), tools: result.tools.length }));
          await client.close();
          NODE
